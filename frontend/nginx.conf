server {
    listen 80;
    server_name devopsdost.xyz;  # Replace with your actual domain or IP address

    # Serve static files (React app)
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:5000;  # Assuming your backend is running on port 5000 inside the Docker container
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Handle other configurations like SSL
    # ssl_certificate /etc/nginx/ssl/devopsdost.xyz.crt;
    # ssl_certificate_key /etc/nginx/ssl/devopsdost.xyz.key;
}
