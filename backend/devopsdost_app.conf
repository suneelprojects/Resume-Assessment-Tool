server {
    listen 80;
    server_name devopsdost.xyz;

    # Serve React frontend
    location / {
        root /path/to/react/build;  # Make sure this path is correct (to the build folder of your React app)
        index index.html;
        try_files $uri /index.html;  # This ensures single-page app routing works
    }

    # Serve Flask API
    location /api {
        proxy_pass http://localhost:5000;  # Your Flask app's local address
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
